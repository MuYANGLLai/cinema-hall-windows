# Gradle 守护进程的 JVM 参数
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# 注意：本文件**刻意不**写 org.gradle.java.home。
# 上游工程把它钉在本机 JDK 17 的绝对路径上（例如 C:\Program Files\Java\jdk-17.0.1），
# 那是为开发机服务的；写进公开仓库会让别人的构建直接失败。
# 本仓库要求 JDK 17 或更高，用你的 JAVA_HOME 或 gradle.properties(~/.gradle) 自行指定。
